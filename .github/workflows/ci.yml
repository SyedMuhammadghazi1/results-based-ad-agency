name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ad_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ad_agency_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ad_agency_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate test database
        run: npm run db:migrate

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (production build on :3003)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: outcome-ads:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check /api/health
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:1/none \
            -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdef012345 \
            -e DATA_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e CRON_SECRET=ci-only-cron-secret-0000 \
            -e APP_URL=http://localhost:3000 \
            outcome-ads:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f app || true
