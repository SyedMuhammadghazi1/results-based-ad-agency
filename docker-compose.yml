# Local development services. Quickstart: `docker compose up -d db mailpit`.
# The full stack (app + one-off migration) runs with: `docker compose --profile full up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ad_agency_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ad_agency_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1027:1025" # SMTP  → set SMTP_HOST=localhost SMTP_PORT=1027
      - "8027:8025" # Web UI → http://localhost:8027

  migrate:
    profiles: ["full"]
    build: .
    command: ["node", "migrate.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ad_agency_dev
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ad_agency_dev
      APP_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
